services:
  development:
    build: .
    volumes:
      - ./results:/opt/perftest/results
      - ./logs:/opt/perftest/logs
      - ./logs:/opt/perftest/logs
    depends_on:
      registration:
        condition: service_healthy
      submissions:
        condition: service_healthy
      obligations:
        condition: service_healthy
    env_file:
      - 'compose/aws.env'
    environment:
      S3_ENDPOINT: 'http://localstack:4566'
      RESULTS_OUTPUT_S3_PATH: 's3://test-results'
      ENVIRONMENT: local
      CI: 'true'
      TEST_SCENARIO: ${TEST_SCENARIO:-baselines}
      REGISTRATION_BASE_URL: http://registration:8085
      SUBMISSIONS_BASE_URL: http://submissions:8085
      OBLIGATIONS_BASE_URL: http://obligations:8085
    networks:
      - performance-tests

  localstack:
    image: localstack/localstack:4.3.0
    ports:
      - '4566:4566' # LocalStack Gateway
      - '4510-4559:4510-4559' # external services port range
    restart: always
    env_file:
      - 'compose/aws.env'
    environment:
      DEBUG: ${DEBUG:-1}
      LS_LOG: WARN # Localstack DEBUG Level
      SERVICES: s3, sqs, sns
      LOCALSTACK_HOST: 127.0.0.1
    volumes:
      - '${TMPDIR:-/tmp}/localstack:/var/lib/localstack'
      - ./compose/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: [ "CMD", "stat", "/tmp/READY" ]
      interval: 3s
      start_period: 5s
      retries: 3
    networks:
      - performance-tests

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    restart: always
    networks:
      - performance-tests

  mongodb:
    image: mongo:7.0.28
    networks:
      - performance-tests

  registration:
    build: ../waste-batteries-reg-backend
    ports:
      - '8085:8085'
    depends_on:
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      ASPNETCORE_URLS: http://+:8085
      AWS_ENDPOINT_URL: http://localstack:4566
      Jwt__MetadataAddress: http://host.docker.internal:3200/cdp-defra-id-stub/.well-known/openid-configuration
      Jwt__Audience: 63983fc2-cfff-45bb-8ec2-959e21062b9a
      Jwt__RequireHttpsMetadata: false
      Mongo__DatabaseUri: mongodb://mongodb:27017/
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'localhost:8085/health']
      interval: 5s
      start_period: 10s
      retries: 10
    networks:
      - performance-tests

  submissions:
    build: ../waste-batteries-submit-backend
    ports:
      - '8086:8085'
    depends_on:
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      ASPNETCORE_URLS: http://+:8085
      AWS_ENDPOINT_URL: http://localstack:4566
      Jwt__MetadataAddress: http://host.docker.internal:3200/cdp-defra-id-stub/.well-known/openid-configuration
      Jwt__Audience: 63983fc2-cfff-45bb-8ec2-959e21062b9a
      Jwt__RequireHttpsMetadata: false
      Mongo__DatabaseUri: mongodb://mongodb:27017/
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'localhost:8085/health']
      interval: 5s
      start_period: 10s
      retries: 10
    networks:
      - performance-tests

  obligations:
    build: ../waste-batteries-obligations-be
    ports:
      - '8087:8085'
    depends_on:
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      ASPNETCORE_URLS: http://+:8085
      AWS_ENDPOINT_URL: http://localstack:4566
      Jwt__MetadataAddress: http://host.docker.internal:3200/cdp-defra-id-stub/.well-known/openid-configuration
      Jwt__Audience: 63983fc2-cfff-45bb-8ec2-959e21062b9a
      Jwt__RequireHttpsMetadata: false
      Mongo__DatabaseUri: mongodb://mongodb:27017/
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'localhost:8085/health']
      interval: 5s
      start_period: 10s
      retries: 10
    networks:
      - performance-tests

networks:
  performance-tests:
    driver: bridge

